services:
  cubesat-db:
    image: mysql:latest
    container_name: CubeSat_DB
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-init:/docker-entrypoint-initdb.d

  cubesat-backend:
    build: .
    container_name: CubeSat_FastAPI
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - cubesat-db

volumes:
  mysql_data:
